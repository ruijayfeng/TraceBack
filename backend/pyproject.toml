[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "traceback-backend"
version = "0.1.0"
description = "TraceBack Task 001 configuration bootstrap"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic==2.11.7",
    "PyYAML==6.0.2",
    "annotated-types==0.7.0",
    "typing-extensions==4.14.1",
    "typing-inspection==0.4.1",
    "duckdb==1.4.1",
    "fastapi==0.115.14",
    "uvicorn==0.35.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
prototype = ["jsonschema==4.23.0"]
test = [
    "jsonschema==4.23.0",
    "httpx==0.28.1",
    "pytest==8.4.1",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "colorama==0.4.6; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
