# Legacy default deployment: AIT-ADS Version 1, scenario russellmitchell.
# data/ait_ads/dataset.yaml registers all scene paths and source profiles.
# load_dataset selects exactly one scene's timezone declarations; this legacy
# override remains byte-semantically compatible for existing default snapshots.
# Namespace keys below identify stable source instances, never input paths.
# AMiner: generator=AMiner; generator_version=unknown;
# format_profile=ait_ads_v1_aminer_json; dataset_version=1;
# timestamp_type=unix_epoch; epoch_unit=seconds; DetectionTimestamp[-1].
# Existing AlgorithmConfig has no source-profile/network-namespace fields.
# Pass these explicit Adapter settings to the preprocessing entry point; they
# are included in its effective snapshot and provenance, without schema changes.
# Confirmed shared network scope: ait_ads.russellmitchell.network.
normalization:
  source_timezones:
    ait_ads.russellmitchell.wazuh: UTC
    ait_ads.russellmitchell.aminer: UTC
  host_aliases: {}
  category_mapping_files:
    - mappings/wazuh-category.yaml
    - mappings/suricata-category.yaml
    - mappings/aminer-category.yaml
  severity_mapping_files:
    - mappings/wazuh-severity.yaml
    - mappings/suricata-severity.yaml
    - mappings/aminer-severity.yaml
duplicate:
  payload_mapping_files:
    - mappings/wazuh-payload.yaml
    - mappings/suricata-payload.yaml
    - mappings/aminer-payload.yaml
